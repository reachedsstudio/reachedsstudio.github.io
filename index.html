<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reached Studio</title>
  <meta name="description" content="Freehand circle test. Draw a circle around the dot to enter Reached Studio." />
  <meta name="theme-color" content="#080808" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=JetBrains+Mono:wght@400&display=swap" />
  <style>
    :root {
      --bg: #080808;
      --fg: #f4f4f5;
      --muted: #71717a;
      --line: #27272a;
      --red: #ff2a1a;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "Inter", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      font-family: var(--mono);
      -webkit-font-smoothing: antialiased;
    }

    body {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (hover: hover) and (pointer: fine) {
      body, a, button { cursor: none; }
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* HUD */
    .hud {
      position: fixed;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--muted);
      pointer-events: none;
      transition: opacity .4s ease;
    }

    .hud--top { top: 16px; }
    .hud--bottom { bottom: 16px; }

    .skip {
      pointer-events: auto;
      color: var(--fg);
      text-decoration: none;
      padding: 8px 0 8px 8px;
    }

    .skip:hover { color: var(--red); }

    a:focus-visible, button:focus-visible {
      outline: 1px solid var(--red);
      outline-offset: 3px;
    }

    /* Title */
    .title {
      position: fixed;
      top: 13vh;
      left: 16px;
      right: 16px;
      text-align: center;
      pointer-events: none;
      transition: opacity .4s ease;
    }

    .title h1 {
      margin: 0;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: .2em;
    }

    .title p {
      margin: .9em 0 0;
      font-family: var(--sans);
      font-weight: 300;
      font-size: 16px;
      color: var(--muted);
    }

    .title .hint {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .14em;
      color: var(--red);
      opacity: 0;
      transition: opacity .6s ease;
    }

    .show-hint .title .hint { animation: blink 1.6s ease-in-out infinite; }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Target dot */
    .target {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow:
        0 0 6px 1px rgba(255, 60, 30, .9),
        0 0 24px 6px rgba(255, 30, 10, .45),
        0 0 70px 20px rgba(200, 0, 0, .18);
      pointer-events: none;
      animation: fade-in 1.2s ease both;
    }

    .target::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: inherit;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .6; }
      50% { transform: scale(1.8); opacity: 0; }
    }

    @keyframes fade-in {
      from { opacity: 0; }
    }

    /* Pen: the dot that follows the pointer */
    .pen {
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 10px 2px rgba(255, 40, 20, .7);
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s ease;
      will-change: transform;
      z-index: 10;
    }

    .pen.is-on { opacity: 1; }

    /* Readout */
    .readout {
      position: fixed;
      bottom: 9vh;
      left: 16px;
      right: 16px;
      text-align: center;
      pointer-events: none;
      transition: opacity .4s ease;
    }

    .score {
      font-size: clamp(44px, 8vw, 84px);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
      color: var(--line);
      transition: color .3s ease;
    }

    .score small {
      font-size: .4em;
      margin-left: .1em;
    }

    .is-drawing .score,
    .is-done .score { color: var(--fg); }

    .verdict {
      min-height: 1.4em;
      margin: .9em 0 0;
      font-size: 12px;
      letter-spacing: .12em;
    }

    .verdict.is-error { color: var(--red); }

    .best {
      margin: .5em 0 0;
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .best .new { color: var(--red); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      opacity: 0;
      visibility: hidden;
      transition: opacity .4s ease, visibility .4s;
    }

    .is-done .actions {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .actions button {
      font: inherit;
      font-size: 12px;
      letter-spacing: .1em;
      color: var(--fg);
      background: none;
      border: 1px solid var(--line);
      padding: 10px 14px;
      transition: border-color .2s ease, color .2s ease;
    }

    .actions button:hover { border-color: var(--red); color: var(--red); }
    .actions .primary { border-color: var(--red); }

    /* Leaving: everything but the ring fades */
    .is-leaving .hud,
    .is-leaving .title,
    .is-leaving .readout,
    .is-leaving .target,
    .is-leaving .pen { opacity: 0; transition: opacity .3s ease; }

    @media (prefers-reduced-motion: reduce) {
      .target, .target::after, .show-hint .title .hint { animation: none; }
      .show-hint .title .hint { opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas aria-hidden="true"></canvas>

  <header class="hud hud--top">
    <span>REACHED STUDIO</span>
    <a class="skip" href="home.html">[ SKIP → ]</a>
  </header>

  <div class="title">
    <h1>TEST // FREEHAND CIRCLE</h1>
    <p>Draw a circle around the dot.</p>
    <p class="hint">PRESS AND DRAG</p>
  </div>

  <div class="target" aria-hidden="true"></div>

  <div class="readout">
    <div class="score" aria-hidden="true"><span data-score>00.0</span><small>%</small></div>
    <p class="verdict" data-verdict role="status"></p>
    <p class="best">BEST <span data-best>--.-</span>%</p>
    <div class="actions">
      <button type="button" data-retry>[ TRY AGAIN ]</button>
      <button type="button" data-share>[ SHARE ]</button>
      <button type="button" class="primary" data-enter>[ ENTER → ]</button>
    </div>
  </div>

  <footer class="hud hud--bottom">
    <span>37.8136° S, 144.9631° E</span>
    <span>COMPASS: NOT PERMITTED</span>
  </footer>

  <div class="pen" aria-hidden="true"></div>

  <script>
    (function () {
      var body = document.body;
      var canvas = document.querySelector("canvas");
      var ctx = canvas.getContext("2d");
      var pen = document.querySelector(".pen");
      var scoreEl = document.querySelector("[data-score]");
      var verdictEl = document.querySelector("[data-verdict]");
      var bestEl = document.querySelector("[data-best]");
      var shareBtn = document.querySelector("[data-share]");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      var RED = "#ff2a1a";
      var BEST_KEY = "circle-best";
      var SITE = "home.html";

      var W = 0, H = 0;
      var state = "idle"; // idle | drawing | done | leaving
      var points = [];
      var scene = { trail: [], trailAlpha: 1, ring: null };
      var lastFit = null;
      var lastScore = 0;
      var dirty = true;
      var tweens = [];
      var penPos = { x: -50, y: -50 };
      var penTarget = { x: -50, y: -50 };

      /* ---------- Geometry ---------- */

      function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function centre() {
        return { x: W / 2, y: H / 2 };
      }

      // Evenly spaced points along the stroke, so slow and fast parts count equally.
      function resample(pts, n) {
        var total = 0;
        for (var i = 1; i < pts.length; i++) total += dist(pts[i - 1], pts[i]);
        if (!total) return null;

        var step = total / (n - 1);
        var out = [pts[0]];
        var prev = pts[0];
        var acc = 0;

        for (var j = 1; j < pts.length; j++) {
          var p = pts[j];
          var d = dist(prev, p);
          while (d > 0 && acc + d >= step && out.length < n) {
            var t = (step - acc) / d;
            var q = { x: prev.x + (p.x - prev.x) * t, y: prev.y + (p.y - prev.y) * t };
            out.push(q);
            prev = q;
            d = dist(prev, p);
            acc = 0;
          }
          acc += d;
          prev = p;
        }
        while (out.length < n) out.push(pts[pts.length - 1]);
        return out;
      }

      // Least-squares circle fit. Works on partial arcs, so the live score is fair.
      function fitCircle(pts) {
        var n = pts.length, mx = 0, my = 0;
        pts.forEach(function (p) { mx += p.x; my += p.y; });
        mx /= n;
        my /= n;

        var suu = 0, svv = 0, suv = 0, suuu = 0, svvv = 0, suvv = 0, svuu = 0;
        pts.forEach(function (p) {
          var u = p.x - mx, v = p.y - my;
          suu += u * u; svv += v * v; suv += u * v;
          suuu += u * u * u; svvv += v * v * v;
          suvv += u * v * v; svuu += v * u * u;
        });

        var det = suu * svv - suv * suv;
        if (Math.abs(det) < 1e-6) return null;

        var a = (suuu + suvv) / 2, b = (svvv + svuu) / 2;
        var uc = (a * svv - b * suv) / det;
        var vc = (b * suu - a * suv) / det;
        return {
          x: uc + mx,
          y: vc + my,
          r: Math.sqrt(uc * uc + vc * vc + (suu + svv) / n)
        };
      }

      // RMS distance from the fitted circle, as a fraction of its radius.
      function wobble(pts, fit) {
        var s = 0;
        pts.forEach(function (p) {
          var e = (dist(p, fit) - fit.r) / fit.r;
          s += e * e;
        });
        return Math.sqrt(s / pts.length);
      }

      // How far the stroke turns around point c, cut off after one full loop.
      function loopAround(pts, c) {
        var total = 0;
        for (var i = 1; i < pts.length; i++) {
          var a1 = Math.atan2(pts[i - 1].y - c.y, pts[i - 1].x - c.x);
          var a2 = Math.atan2(pts[i].y - c.y, pts[i].x - c.x);
          var d = a2 - a1;
          if (d > Math.PI) d -= 2 * Math.PI;
          if (d < -Math.PI) d += 2 * Math.PI;
          total += d;
          if (Math.abs(total) >= 2 * Math.PI) {
            return { pts: pts.slice(0, i + 1), sweep: 360 };
          }
        }
        return { pts: pts, sweep: Math.abs(total) * 180 / Math.PI };
      }

      function roundnessScore(pts, fit) {
        return Math.max(0, Math.min(99.9, (1 - wobble(pts, fit) * 3) * 100));
      }

      /* ---------- Rendering ---------- */

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (state !== "leaving") reset();
        dirty = true;
      }

      function glow(alpha, width) {
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = RED;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.shadowColor = RED;
        ctx.shadowBlur = 18;
      }

      function render() {
        ctx.clearRect(0, 0, W, H);

        if (scene.trail.length > 1 && scene.trailAlpha > 0) {
          glow(scene.trailAlpha, 3);
          ctx.beginPath();
          ctx.moveTo(scene.trail[0].x, scene.trail[0].y);
          for (var i = 1; i < scene.trail.length; i++) ctx.lineTo(scene.trail[i].x, scene.trail[i].y);
          ctx.stroke();
        }

        if (scene.ring && scene.ring.alpha > 0) {
          glow(scene.ring.alpha, scene.ring.width);
          ctx.beginPath();
          ctx.arc(scene.ring.x, scene.ring.y, scene.ring.r, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.globalAlpha = 1;
      }

      function tween(ms, step, done) {
        if (reduce || ms <= 0) {
          step(1);
          if (done) done();
          dirty = true;
          return;
        }
        tweens.push({ start: performance.now(), ms: ms, step: step, done: done });
      }

      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
      function easeIn(t) { return t * t * t; }

      /* ---------- Readout ---------- */

      function fmt(n) {
        return (n < 10 ? "0" : "") + n.toFixed(1);
      }

      function getBest() {
        try { return parseFloat(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; }
      }

      function setBest(v) {
        try { localStorage.setItem(BEST_KEY, v.toFixed(1)); } catch (e) {}
      }

      function showBest(isNew) {
        var best = getBest();
        bestEl.innerHTML = best ? fmt(best) + (isNew ? ' <span class="new">// NEW BEST</span>' : "") : "--.-";
      }

      function verdictFor(score) {
        if (score >= 95) return "[ PASS // COMPASS NOT REQUIRED ]";
        if (score >= 85) return "[ PASS // STEADY HAND ]";
        if (score >= 70) return "[ PASS // NEEDS A TEMPLATE ]";
        return "[ PASS // THIS IS AN OVAL ]";
      }

      function say(text, isError) {
        verdictEl.textContent = text;
        verdictEl.classList.toggle("is-error", !!isError);
      }

      /* ---------- Attempt lifecycle ---------- */

      function reset() {
        state = "idle";
        points = [];
        scene.trail = [];
        scene.trailAlpha = 1;
        scene.ring = null;
        lastFit = null;
        tweens = [];
        body.classList.remove("is-drawing", "is-done", "is-leaving");
        scoreEl.textContent = "00.0";
        shareBtn.textContent = "[ SHARE ]";
        say("");
        dirty = true;
      }

      function liveScore() {
        if (points.length < 8) return;
        var rs = resample(points, 64);
        var fit = rs && fitCircle(rs);
        var turn = loopAround(points, centre()).sweep;
        if (!fit || turn < 40) {
          scoreEl.textContent = "00.0";
          return;
        }
        scoreEl.textContent = fmt(roundnessScore(rs, fit));
      }

      function fail(message) {
        state = "idle";
        body.classList.remove("is-drawing");
        scoreEl.textContent = "00.0";
        say(message, true);
        var from = scene.trailAlpha;
        tween(600, function (t) { scene.trailAlpha = from * (1 - t); }, function () {
          if (state === "idle") scene.trail = [];
        });
      }

      function evaluate() {
        var c = centre();

        if (points.length < 12) return fail("PRESS AND DRAG TO DRAW");

        var loop = loopAround(points, c);
        var rs = resample(loop.pts, 128);
        var fit = rs && fitCircle(rs);
        var minR = Math.max(36, Math.min(W, H) * 0.08);

        if (!fit || fit.r < minR) return fail("TOO SMALL // DRAW BIGGER");
        if (loop.sweep < 300) {
          if (dist(fit, c) > fit.r) return fail("AROUND THE DOT // NOT BESIDE IT");
          return fail("CLOSE THE LOOP");
        }

        // Small penalty for a loop that doesn't meet its start.
        var gap = Math.min(dist(rs[0], rs[rs.length - 1]) / fit.r, 1);
        var score = roundnessScore(rs, fit) * (1 - 0.1 * gap);

        state = "done";
        lastFit = fit;
        lastScore = score;
        body.classList.remove("is-drawing");
        body.classList.add("is-done");
        scoreEl.textContent = fmt(score);
        say(verdictFor(score));
        verdictEl.insertAdjacentHTML("beforeend", '<span class="sr-only"> Score ' + score.toFixed(1) + " percent.</span>");

        var isNew = score > getBest();
        if (isNew) setBest(score);
        showBest(isNew);

        lockIn(rs, fit);
      }

      // Morph the hand-drawn stroke onto its fitted circle, then crossfade to a clean ring.
      function lockIn(rs, fit) {
        var from = rs.map(function (p) { return { x: p.x, y: p.y }; });
        var to = rs.map(function (p) {
          var a = Math.atan2(p.y - fit.y, p.x - fit.x);
          return { x: fit.x + fit.r * Math.cos(a), y: fit.y + fit.r * Math.sin(a) };
        });

        scene.ring = { x: fit.x, y: fit.y, r: fit.r, alpha: 0, width: 3 };
        tween(700, function (t) {
          var e = easeOut(t);
          scene.trail = from.map(function (p, i) {
            return { x: p.x + (to[i].x - p.x) * e, y: p.y + (to[i].y - p.y) * e };
          });
          scene.trailAlpha = 1 - e;
          scene.ring.alpha = e;
        });
      }

      function enter() {
        if (state === "leaving") return;
        var fit = lastFit || { x: W / 2, y: H / 2, r: 10 };
        state = "leaving";
        body.classList.add("is-leaving");
        scene.trail = [];

        if (reduce) {
          window.location.href = SITE;
          return;
        }

        var maxR = Math.hypot(W, H) + 60;
        tween(850, function (t) {
          var e = easeIn(t);
          scene.ring = {
            x: fit.x,
            y: fit.y,
            r: fit.r + (maxR - fit.r) * e,
            width: 3 + 60 * e,
            alpha: 1 - 0.6 * t
          };
        }, function () {
          window.location.href = SITE;
        });
      }

      function share() {
        var url = /^https?:/.test(location.protocol) ? location.href.split("#")[0] : "https://reachedsstudio.github.io/";
        var text = "I drew a " + lastScore.toFixed(1) + "% freehand circle. Beat it:";

        if (navigator.share) {
          navigator.share({ text: text, url: url }).catch(function () {});
          return;
        }
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text + " " + url).then(function () {
            shareBtn.textContent = "[ COPIED ]";
          }, function () {});
        }
      }

      /* ---------- Input ---------- */

      function setPen(e, snap) {
        penTarget.x = e.clientX;
        penTarget.y = e.clientY;
        if (snap) { penPos.x = penTarget.x; penPos.y = penTarget.y; }
      }

      canvas.addEventListener("pointerdown", function (e) {
        if (state === "leaving" || e.button > 0) return;
        if (state === "done") reset();
        tweens = [];
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

        state = "drawing";
        body.classList.add("is-drawing");
        body.classList.remove("show-hint");
        clearTimeout(hintTimer);
        say("");
        points = [{ x: e.clientX, y: e.clientY }];
        scene.trail = points;
        scene.trailAlpha = 1;
        scene.ring = null;
        setPen(e, true);
        pen.classList.add("is-on");
        dirty = true;
      });

      window.addEventListener("pointermove", function (e) {
        setPen(e, state === "drawing");
        if (e.pointerType === "mouse" && state !== "leaving") pen.classList.add("is-on");
        if (state !== "drawing") return;

        var p = { x: e.clientX, y: e.clientY };
        if (dist(p, points[points.length - 1]) < 2) return;
        points.push(p);
        dirty = true;
      });

      function endStroke(e) {
        if (state !== "drawing") return;
        if (e.pointerType !== "mouse") pen.classList.remove("is-on");
        evaluate();
      }

      window.addEventListener("pointerup", endStroke);
      window.addEventListener("pointercancel", function () {
        if (state === "drawing") fail("");
      });

      document.addEventListener("pointerleave", function () {
        if (state !== "drawing") pen.classList.remove("is-on");
      });

      document.querySelector("[data-retry]").addEventListener("click", reset);
      document.querySelector("[data-enter]").addEventListener("click", enter);
      shareBtn.addEventListener("click", share);

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") window.location.href = SITE;
        if (e.key === "Enter" && state === "done" && !/^(BUTTON|A)$/.test(document.activeElement.tagName)) enter();
      });

      // Returning with the back button restores a frozen page; start fresh.
      window.addEventListener("pageshow", function (e) {
        if (e.persisted) reset();
      });

      var hintTimer = setTimeout(function () {
        if (state === "idle") body.classList.add("show-hint");
      }, 4000);

      /* ---------- Loop ---------- */

      function tick(now) {
        var ease = state === "drawing" || reduce ? 1 : 0.18;
        penPos.x += (penTarget.x - penPos.x) * ease;
        penPos.y += (penTarget.y - penPos.y) * ease;
        pen.style.transform = "translate(" + penPos.x + "px," + penPos.y + "px)";

        if (tweens.length) {
          var list = tweens;
          tweens = [];
          list.forEach(function (tw) {
            var t = Math.min((now - tw.start) / tw.ms, 1);
            tw.step(t);
            if (t < 1) tweens.push(tw);
            else if (tw.done) tw.done();
          });
          dirty = true;
        }

        if (dirty) {
          if (state === "drawing") liveScore();
          render();
          dirty = false;
        }

        requestAnimationFrame(tick);
      }

      window.addEventListener("resize", resize);
      resize();
      showBest(false);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
